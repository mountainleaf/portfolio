title: About Me
description: I'm Tianjiao Yan, a Peking University undergraduate sitting between wet-lab biology and computer science. I'm learning to build things that connect the two.
content: |
  Hi, I'm **Tianjiao Yan** (闫天娇) — a Peking University undergraduate who started in a wet lab and ended up writing a lot of code on the way.

  I picked up pipettes before I picked up Python. Somewhere between gel images and Jupyter notebooks I realized I was happier when I could turn a noisy biological question into something I could query, model, and ship. So I've been quietly migrating from the bench to the terminal ever since — not because I dislike biology, but because I want better tools for it.

  ### What I'm building toward

  Short term, I'm aiming at software / algorithm internships and roles where I can be useful from day one — solid engineering fundamentals, clean code, and the patience to read a paper instead of just installing the package.

  Long term, I'm curious about **AI for biology** — protein structure, single-cell, drug discovery, anything where messy biological data meets clever modeling. I don't think you need to choose between "doing biology" and "doing CS." I think the interesting work happens when one person can do both, badly at first, and then less badly.

  ### How I work

  - I write things down. Notebooks, READMEs, blog posts — if I can't explain it, I don't understand it.
  - I prefer **small, working, ugly** over **big, broken, beautiful**. Ship the prototype, then make it nice.
  - I read other people's code more than I write my own. It's the fastest way to learn taste.
  - I'm comfortable being the least experienced person in the room. That's usually where I learn the most.

  ### Outside of work

  I read too much. I drink too much coffee. I take long walks around 未名湖. I keep a list of papers I'm definitely going to read this weekend, and I rarely finish it.

  Thanks for stopping by. If anything here looks worth a conversation, my inbox is open.
